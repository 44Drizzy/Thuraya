<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thuraya &#1579;&#1585;&#1610;&#1575;</title>
<meta name="description" content="Thuraya helps you budget, save for goals, keep up with bills and keep your receipts in one place.">
<meta name="theme-color" content="#0C2F35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thuraya">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Home-screen app additions: phone safe areas, no zoom on input focus, no bounce. */
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
@media all{
  .app{padding-top:env(safe-area-inset-top,0px);background:var(--navy)}
  .app > .scroll{background:var(--bg)}
  .fab{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .notif{top:calc(12px + env(safe-area-inset-top,0px))}
  .sheet .panel{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .sheet .panel{max-height:calc(100% - env(safe-area-inset-top,0px) - 24px)}
  input,select,textarea{font-size:16px!important}
}
</style>
</head>
<body><style>
/* Layout: a phone-sized app (full-screen on phones, framed beside a brand panel on wide screens). Navy = trust, teal = innovation, gold = achievement (from the brand guide). */
:root{
  --navy:#0C2F35; --navy-2:#0F3238; --teal:#0F3238; --teal-2:#A9A2EE; --teal-soft:#E9EDE6;
  --gold:#8C7B33; --gold-soft:#F1ECD9; --bg:#F5F4EE; --surface:#FFFFFF; --surface-2:#EDEBE3;
  --ink:#10292D; --muted:#66726F; --line:#E2E0D6; --danger:#A8452F; --danger-soft:#F6E3DC; --ok:#2F7D57;
  --ai-bg:#EEECFC; --ai-ink:#1E1A44; --deep-muted:#93AAA6;
  --page:#F5F4EE; --hero-ink:#EEF2EC; --frame:#0B1B1E; --shadow:0 1px 2px rgba(16,41,45,.05);
  --font:'Inter Tight','Inter','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-ar:'IBM Plex Sans Arabic','Inter Tight',system-ui,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#071C20; --navy-2:#0C2A2F; --teal:#DCE8E1; --teal-2:#A9A2EE; --teal-soft:#16363A;
  --gold:#CDB86B; --gold-soft:#2D2A1A; --bg:#0A1E22; --surface:#10292D; --surface-2:#18363B;
  --ink:#EEF2EC; --muted:#93AAA6; --line:#21403F; --danger:#E3896F; --danger-soft:#3A2420; --ok:#6CC095;
  --ai-bg:#24234A; --ai-ink:#E6E3FF; --deep-muted:#93AAA6;
  --page:#0A1E22; --hero-ink:#EEF2EC; --frame:#000; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#071C20; --navy-2:#0C2A2F; --teal:#DCE8E1; --teal-2:#A9A2EE; --teal-soft:#16363A;
  --gold:#CDB86B; --gold-soft:#2D2A1A; --bg:#0A1E22; --surface:#10292D; --surface-2:#18363B;
  --ink:#EEF2EC; --muted:#93AAA6; --line:#21403F; --danger:#E3896F; --danger-soft:#3A2420; --ok:#6CC095;
  --ai-bg:#24234A; --ai-ink:#E6E3FF; --deep-muted:#93AAA6;
  --page:#0A1E22; --hero-ink:#EEF2EC; --frame:#000; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{font-family:var(--font-ar)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* Stage: the app fills the whole window at every size; content keeps a readable column on wide screens. */
.stage{height:100%}
.device{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.app{height:100%;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 0;font-weight:700;font-size:14px;height:40px}
.statusbar .dots{display:flex;gap:5px;align-items:center}
.statusbar i{display:block;width:4px;border-radius:1px;background:currentColor}
.statusbar{display:none}
.pad{width:100%;max-width:760px;margin-inline:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:640px){.lift .tiles{grid-template-columns:repeat(4,1fr)}}

/* Hero (home) */
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 70%,var(--teal) 140%);color:var(--hero-ink);padding-bottom:64px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -20% -60px -20%;height:120px;border-top:2px solid rgba(212,162,58,.55);border-radius:50% 50% 0 0}
.hero .top{display:flex;align-items:center;justify-content:space-between;padding-top:10px}
.wordmark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.wordmark .logo{width:30px;height:30px;color:#fff}
.wordmark .ar{font-family:var(--font-ar);font-weight:700;color:var(--gold)}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;position:relative}
.hero .icon-btn{background:rgba(255,255,255,.1)}
.badge{position:absolute;top:6px;inset-inline-end:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold);color:#1B1300;font-size:10px;font-weight:800;display:grid;place-items:center}
.hero h1{font-size:24px;margin:18px 0 4px;letter-spacing:-.01em}
.hero .sub{opacity:.8;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-demo{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(212,162,58,.2);color:#F3D58E;padding:3px 8px;border-radius:999px}
html[lang="ar"] .chip-demo{letter-spacing:0}

.lift{margin-top:-48px;position:relative;z-index:1;display:grid;gap:14px;padding-bottom:48px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.budget-card{display:flex;align-items:center;gap:16px;padding:16px 18px;width:100%}
.budget-card .meta{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
html[lang="ar"] .eyebrow{letter-spacing:0;text-transform:none;font-size:13px}
.big{font-size:24px;font-weight:800;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.chev{color:var(--muted)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-height:104px}
.tile .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.tile b{font-size:15px}
.tile span{font-size:12.5px;color:var(--muted)}
.t-teal{background:var(--teal-soft);color:var(--teal)}
.t-gold{background:var(--gold-soft);color:var(--gold)}
.t-navy{background:var(--surface-2);color:var(--navy-2)}
:root[data-theme="dark"] .t-navy{color:#9CC3E8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .t-navy{color:#9CC3E8}}
.t-red{background:var(--danger-soft);color:var(--danger)}

.ask-bar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);width:100%}
.ask-bar .meta{flex:1}
.ask-bar b{display:block}
.bot{width:40px;height:40px;flex:none}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px -2px}
.sec-h h2{font-size:16px;margin:0}
.link{color:var(--teal);font-weight:700;font-size:13px}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%}
.row + .row{border-top:1px solid var(--line)}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta span{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:700;white-space:nowrap}
.ri{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-red{background:var(--danger-soft);color:var(--danger)}
.p-gold{background:var(--gold-soft);color:#9A6E12}
:root[data-theme="dark"] .p-gold{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .p-gold{color:var(--gold)}}
.p-teal{background:var(--teal-soft);color:var(--teal)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.btn-mini{font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:10px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}

.tip{padding:14px 16px;display:flex;gap:12px;background:linear-gradient(135deg,var(--teal-soft),var(--surface));}
.tip b{display:block;margin-bottom:2px}
.tip p{margin:0;font-size:13.5px}

/* Page header (inner screens) */
.ph{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:6px;background:var(--bg);position:sticky;top:0;z-index:5}
.ph h1{font-size:22px;margin:0;flex:1;letter-spacing:-.01em}
.ph .icon-btn{background:var(--surface);border:1px solid var(--line)}
.content{display:grid;gap:14px;padding-top:8px;padding-bottom:100px}

/* Donut */
.donut-wrap{display:flex;align-items:center;gap:18px;padding:18px}
.donut{position:relative;width:132px;height:132px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c b{font-size:20px;font-weight:800}
.donut .c span{font-size:11.5px;color:var(--muted)}
.legend{display:grid;gap:12px;flex:1;min-width:0}
.legend .lg{display:flex;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.legend b{display:block;font-size:14px}
.legend span{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.bar.gold i{background:var(--gold)}
.bar.red i{background:var(--danger)}

.group-row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.group-row .meta{flex:1;min-width:0;display:grid;gap:6px}
.group-row .top{display:flex;justify-content:space-between;gap:8px}

.cat-row{display:grid;gap:6px;padding:10px 16px}
.cat-row .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.cat-row .top span:first-child{display:flex;align-items:center;gap:8px;font-weight:600}
.cat-row .ic{width:18px;height:18px;color:var(--muted)}

.lockcard{padding:16px;display:grid;gap:8px;position:relative;overflow:hidden}
.lockcard .hd{display:flex;align-items:center;gap:8px;font-weight:700}
.lockcard .hd .pill{margin-inline-start:auto}
.blur{filter:blur(5px);user-select:none;pointer-events:none}
.unlock{position:absolute;inset:44px 16px 16px;display:grid;place-content:center;text-align:center;gap:8px}

.fab{position:absolute;inset-inline-end:max(20px,calc((100% - 760px)/2 + 20px));bottom:96px;width:56px;height:56px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(14,42,71,.6);z-index:6}
:root[data-theme="dark"] .fab{background:var(--teal);color:#06201F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{background:var(--teal);color:#06201F}}

/* Goals */
.goal{padding:16px;display:grid;gap:12px}
.goal .hd{display:flex;gap:12px;align-items:center}
.goal .hd .meta{flex:1;min-width:0}
.goal .hd b{display:block;font-size:16px}
.goal .nums{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.goal .nums b{color:var(--ink)}
.goal-bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-2));border-radius:99px}
.suggest{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.suggest .bot{width:32px;height:32px}
.suggest p{margin:0;font-size:13px;flex:1}
.suggest b{display:block;font-size:12px;color:var(--teal)}
.goal .acts{display:flex;gap:8px}

.summary{padding:16px 18px;display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border:0}
.summary .meta{flex:1}
.summary .eyebrow{color:rgba(255,255,255,.7)}

/* Receipts */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:16px;font-weight:700;width:100%}
.btn-primary{background:var(--teal);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#05201E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{color:#05201E}}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.6;cursor:default}
.warranty{display:flex;gap:6px;align-items:center;font-size:12px;margin-top:3px}
.warranty .ic{width:14px;height:14px}
.alert{padding:14px 16px;display:flex;gap:12px;align-items:center;background:var(--gold-soft);border-color:transparent}
.alert p{margin:0;font-size:13.5px;flex:1}
.thumb{width:100%;max-height:260px;object-fit:contain;border-radius:14px;background:var(--surface-2)}

/* Chat */
.chat{display:flex;flex-direction:column;height:100%}
.chat .ph{position:static;border-bottom:1px solid var(--line);padding-bottom:10px}
.chat .ph .meta{flex:1}
.chat .ph b{display:block;font-size:17px}
.chat .ph span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.live.off{background:var(--gold)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px;padding-bottom:12px;scrollbar-width:none}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg .bub{padding:11px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;min-width:0}
.msg.ai .bub{background:var(--teal-soft);border-end-start-radius:6px}
.msg.me{align-self:flex-end}
.msg.me .bub{background:var(--navy);color:#fff;border-end-end-radius:6px}
:root[data-theme="dark"] .msg.me .bub{background:var(--surface-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg.me .bub{background:var(--surface-2)}}
.msg .bot{width:30px;height:30px}
.msg .note{font-size:11px;color:var(--muted);margin-top:4px;display:block}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--teal);opacity:.4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips button{white-space:nowrap;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--teal)}
.composer{display:flex;gap:8px;align-items:center;padding-top:8px;padding-bottom:14px;border-top:1px solid var(--line);background:var(--bg)}
.composer input{flex:1;min-width:0;padding:13px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.send{width:46px;height:46px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.5}

/* Nav */
.nav{position:relative;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);padding-top:8px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px),calc((100% - 620px)/2));padding-right:max(8px,env(safe-area-inset-right,0px),calc((100% - 620px)/2))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.nav button[aria-current="page"]{color:var(--teal)}
.nav .center{margin-top:-26px}
.nav .center .orb{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,var(--teal),var(--navy-2));display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(31,138,133,.7);border:4px solid var(--surface)}
.nav .center .orb .bot{width:34px;height:34px}

/* Rest of month */
.pill{display:inline-flex;align-items:center;gap:5px}
.pill .ic{width:13px;height:13px}
.rest{padding:16px 18px;display:grid;gap:12px;align-content:start}
.rest .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rest .main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rest .stats{display:flex;gap:18px}
.rest .stats div{display:grid}
.rest .stats b{font-size:15px}
.rest .stats span{font-size:12px;color:var(--muted)}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend-row{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend-row span{display:flex;align-items:center;gap:6px}
.legend-row i{width:8px;height:8px;border-radius:50%;display:block}
.billchips{display:flex;gap:8px;flex-wrap:wrap}
.billchips span{font-size:12.5px;padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.warn{font-size:13px;color:var(--danger);margin:0}
.home-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.home-grid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.lift,.content{grid-template-columns:minmax(0,1fr)}
.tiles > *{min-width:0}
/* Health score */
.health{display:flex;align-items:center;gap:16px;padding:16px 18px;width:100%}
.health .meta{flex:1;min-width:0}
.health .hl{display:block;font-size:18px;margin:1px 0}
.health .score{position:relative;width:64px;height:64px;flex:none}
.health .score b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
.hrow{display:grid;gap:6px}
.hrow .top{display:flex;justify-content:space-between;font-size:14px}
/* Trend chart */
.chart{padding:16px 18px;display:grid;gap:12px}
.chart-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.chart-hd b{font-size:16px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--font)}
.chart text.val{fill:var(--ink);font-weight:700}
/* Bank sync badge */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:999px}
.sync i{width:7px;height:7px;border-radius:50%;background:#5CD6A0;box-shadow:0 0 0 3px rgba(92,214,160,.25)}
/* Splash */

.scroll.enter .lift > :nth-child(5),.scroll.enter .content > :nth-child(5){animation-delay:.16s}

const pad2 = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parse = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const today0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const addMonths = (d,n) => { const x=new Date(d); const day=x.getDate(); x.setDate(1); x.setMonth(x.getMonth()+n); const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(day,last)); return x; };
const daysUntil = s => Math.round((parse(s)-today0())/864e5);
const monthsBetween = (a,b) => (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + (b.getDate()>=a.getDate()?0:-1);

}

const num = (n,d) => Number(n||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const kd = (n,d) => { const v = num(n, d===undefined ? (Math.round(n)===Number(n)?0:3) : d); return S.lang==="ar" ? `${v} ${t("kd")}` : `${t("kd")} ${v}`; };
const kd3 = n => kd(n,3);

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

function monthTx(){ const t0=today0(); return S.txns.filter(x=>{const d=parse(x.date); return d.getMonth()===t0.getMonth() && d.getFullYear()===t0.getFullYear();}); }
function totals(){
  const list=monthTx(); let ess=0,opt=0; const byCat={};
  for(const x of list){ const c=CAT[x.cat]||CAT.other; if(c.ess) ess+=x.amount; else opt+=x.amount; byCat[x.cat]=(byCat[x.cat]||0)+x.amount; }
  const essLim=S.budget*S.essPct/100, optLim=S.budget-essLim;
  const t0=today0(); const dim=new Date(t0.getFullYear(),t0.getMonth()+1,0).getDate();
  return {ess,opt,spent:ess+opt,essLim,optLim,byCat,dim,day:t0.getDate(),daysLeft:dim-t0.getDate()};
}
function goalPlan(g){
  const rem=Math.max(0,g.target-g.saved);
  if(rem<=0) return {done:true,rem:0};
  const months=monthsBetween(today0(),parse(g.date));
  if(months<1 && daysUntil(g.date)<0) return {late:true,rem};
  const m=Math.max(1,months);
  return {rem,monthly:Math.ceil(rem/m),months:m};
}
function nextMonthFree(){
  const T=totals();
  const optPace = T.day>0 ? T.opt/T.day*T.dim : T.opt;
  const goalsMonthly = S.goals.reduce((a,g)=>{const p=goalPlan(g); return a+(p.monthly||0);},0);
  return {free: S.income - T.essLim - optPace - goalsMonthly, optPace, goalsMonthly};
}
function dueLabel(s){ const n=daysUntil(s); if(n<0) return [t("overdue"),"p-red"]; if(n===0) return [t("due_today"),"p-red"]; if(n===1) return [t("due_tom"),"p-red"]; return [t("due_in",{n}), n<=3?"p-red":n<=7?"p-gold":"p-mute"]; }
function warrantyEnd(r){ return r.warranty ? iso(addMonths(parse(r.date), r.warranty)) : null; }
function sortedRem(){ return [...S.reminders].sort((a,b)=>parse(a.due)-parse(b.due)); }

function ring(p,size,stroke,color,track){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-clamp(p,0,1));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

  return b ? `<span class="sync"><i></i>${esc(t("synced",{bank:b.n}))}</span>` : `<span>${esc(t("days_left",{n:totals().daysLeft}))}</span>`;

function restOfMonth(){
  const T=totals(), t0=today0(), end=new Date(t0.getFullYear(),t0.getMonth()+1,0);
  const bills=sortedRem().filter(r=>{const d=parse(r.due); return d>=t0 && d<=end;});
  const billsAmt=bills.reduce((a,r)=>a+r.amount,0);
  const daysRem=T.dim-T.day+1;
  const left=Math.round((S.budget-T.spent-billsAmt)*1000)/1000;
  return {T,bills,billsAmt,daysRem,left,perDay:Math.max(0,left)/daysRem,end};
}

function investCheck(){
  const R=restOfMonth(), T=R.T, nm=nextMonthFree();
  const cash=Number(S.cash)||0;
  const safety=Math.round(T.essLim*3);
  const ef=S.goals.find(g=>g.icon==="piggy"); const safetyGap=Math.max(0,safety-(ef?ef.saved:0));
  const committed=R.billsAmt+Math.max(0,R.left);
  const available=Math.max(0,Math.floor((cash-committed-safetyGap)*1000)/1000);
  const bnplLeft=S.reminders.filter(r=>r.provider).reduce((a,r)=>a+r.amount*((r.of||1)-(r.n||1)+1),0);
  const overdue=S.reminders.some(r=>daysUntil(r.due)<0);
  const monthly=Math.max(0,Math.floor(nm.free));
  const checks=[
    {ok:!overdue,k:"chk_bills"},
    {ok:bnplLeft<=S.income*0.5,k:"chk_bnpl",v:{a:kd(Math.round(bnplLeft*1000)/1000)}},
    {ok:cash-committed>=safetyGap,k:"chk_safety",v:{a:kd(safety)}},
    {ok:cash-committed>0,k:"chk_cash"}
  ];
  const level=overdue?"no":available>=200?"yes":available>0?"part":"no";
  return {cash,available,monthly,checks,level,safety,overdue};
}
function investAnswer(amount,kind){

let toastT;

function showNotif(){

    <div style="display:flex;gap:10px;align-items:flex-start"><span class="ri t-gold" style="width:34px;height:34px">${ic("bell")}</span><div><b>${esc(t("notif_t"))}</b><p>${esc(t("notif_b",{name:tx(r.name),when,a:kd(r.amount)}))}</p></div></div>

async function shrink(file){
  return new Promise(res=>{ try{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const s=Math.min(1,480/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",.7)); };
    im.onerror=()=>{URL.revokeObjectURL(url); res(null);}; im.src=url; }catch(e){res(null);} });
}

function rules(){
  const langRule = S.lang==="ar" ? "Reply in Kuwaiti Arabic dialect (اللهجة الكويتية), friendly and clear. Write amounts like 150 د.ك." : "Reply in English. Write amounts like KD 150.";
  return `You are Thuraya (ثريا), the money helper inside the Thuraya budgeting app in Kuwait. ${langRule}
Talk like a warm, sensible friend who is good with money, not like a bot. Answer in one to three short sentences of plain text, using the user's real numbers below. No bullet points, lists, headings, bold or emoji unless the user asks for a breakdown. Never call yourself an AI, an assistant or a language model, and don't open with filler like "Great question".
Help with budgeting, spending habits, bills, saving goals and warranties.
If asked whether they can afford to invest (for example in gold or Kuwaiti stocks on Boursa Kuwait), answer from investReadiness: say how much is free now and per month without touching bills or the safety net, and whether a requested amount fits. Never recommend specific stocks, companies, funds or crypto and never predict prices; add one short sentence that you can't say what to buy and a licensed advisor can help with that.
If the data can't answer the question, say so plainly and what you'd need.

USER DATA (JSON):
${financeContext()}`;
}
function localAnswer(q){
  const s=q.toLowerCase(); const T=totals(); const nm=nextMonthFree(); const A=S.lang==="ar";
  const cats=Object.entries(T.byCat).sort((a,b)=>b[1]-a[1]);
  if(/invest|gold|stock|share|boursa|bourse|ذهب|أسهم|اسهم|استثمر|أستثمر|استثمار|بورصة/.test(s)){
    const sd=s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
    const mt=sd.match(/(\d+(?:\.\d+)?)/); const amount=mt?parseFloat(mt[1]):0;
    const kind=/stock|share|boursa|bourse|أسهم|اسهم|بورصة/.test(s)?"stocks":"gold";
    if(amount>0) return investAnswer(amount,kind).text+" "+t("inv_disc_short");
    const C=investCheck();
    return (A
      ? `حالياً تقدر تستثمر تقريباً ${kd(C.available)} بدون ما تمس فواتيرك أو فلوس الطوارئ${C.monthly>0?`، وبعدها حوالي ${kd(C.monthly)} كل شهر`:""}.`
      : `Right now you could invest about ${kd(C.available)} without touching your bills or your safety net${C.monthly>0?`, then roughly ${kd(C.monthly)} a month after that`:""}.`)+" "+t("inv_disc_short");
  }
  if(/school|supplies|stationery|مدرس|مدارس|قرطاس/.test(s)){
    const g=S.goals.find(x=>x.icon==="backpack"); const p=g?goalPlan(g):null; const rm=S.reminders.find(r=>r.type==="school"); const sp=T.byCat.school||0;
    const d=rm?fdate(rm.due,{day:"numeric",month:"long"}):"";
    return A
      ? `صرفت ${kd(sp)} على المدرسة هالشهر.${g&&p&&p.monthly?` لو حطيت ${kd(p.monthly)} على جنب كل شهر، بتكون جاهز للفصل الثاني.`:""}${rm?` ولا تنسى ${tx(rm.name)} (${kd(rm.amount)}) يوم ${d}.`:""} واشتر القرطاسية قبل الدوام بأسبوعين، العروض تكون أحسن.`
      : `You've spent ${kd(sp)} on school so far this month.${g&&p&&p.monthly?` If you put aside ${kd(p.monthly)} a month, you'll be ready for the second term.`:""}${rm?` Don't forget the ${tx(rm.name).toLowerCase()} of ${kd(rm.amount)} on ${d}.`:""} Buying supplies a couple of weeks early usually gets you better offers.`;
  }
  if(/trip|travel|afford|vacation|سفر|اسافر|أسافر|سفرة|اقدر|أقدر/.test(s)){
    const g=S.goals.find(x=>x.icon==="plane"); const free=Math.max(0,Math.floor(nm.free));
    if(g) return A
      ? `إيه، تقدر. عندك ${kd(g.saved)} في ${tx(g.name)}${free>0?`، وبيتبقى لك تقريباً ${kd(free)} الشهر الجاي بعد المصاريف`:""}. يعني سفرة لين ${kd(g.saved+free)} ما بتأثر على فواتيرك.`
      : `Yes, you can. You've got ${kd(g.saved)} in your ${tx(g.name)} fund${free>0?`, plus about ${kd(free)} spare next month after the essentials`:""}. So a trip up to around ${kd(g.saved+free)} won't touch your bills.`;
    return A
      ? `الشهر الجاي بيتبقى لك تقريباً ${kd(free)} بعد المصاريف والادخار. لو السفرة أغلى من جذي، الأحسن تأجلها شهر.`
      : `Next month you'll have about ${kd(free)} spare after the essentials and your savings. If the trip costs more than that, pushing it back a month would be safer.`;
  }
  if(/save|saving|وفر|أوفر|اوفر|ادخر|ادخار/.test(s)){
    const opt=cats.filter(([c])=>!(CAT[c]||CAT.other).ess).slice(0,2);
    const cut=Math.round(opt.reduce((a,[,v])=>a+v*.25,0));
    const parts=opt.map(([c,v])=>`${A?(CAT[c]||CAT.other).ar:(CAT[c]||CAT.other).en.toLowerCase()} (${kd(v)})`);
    if(!parts.length) return A? "مصاريفك الاختيارية قليلة هالشهر. أحسن شي تسويه إنك تحوّل الادخار أول ما ينزل الراتب." : "Your optional spending is already low this month. The best next step is moving your savings on payday, before you start spending.";
    return A
      ? `أسهل مكان تبدأ منه ${joinList(parts)}. لو خففتهم الربع بس، بتوفر حوالي ${kd(cut)} هالشهر. وحوّل مبلغ الادخار أول ما ينزل الراتب، قبل لا تبدأ تصرف.`
      : `The easiest place to start is ${joinList(parts)}. Cutting those by just a quarter saves you about ${kd(cut)} this month. It also helps to move your savings on payday, before you start spending.`;
  }
  if(/goal|track|هدف|أهداف|اهداف/.test(s)){
    const act=S.goals.filter(g=>g.saved<g.target).slice(0,3);
    if(!act.length) return A? "خلصت كل أهدافك. وقت تحط هدف جديد!" : "You've hit all your goals. Time to set a new one.";
    const lines=act.map(g=>{const p=goalPlan(g); const pc=Math.round(g.saved/g.target*100);
      return A? `${tx(g.name)} وصلت ${pc}٪${p.monthly?` وتحتاج ${kd(p.monthly)} بالشهر`:""}.` : `${tx(g.name)} is ${pc}% there${p.monthly?` and needs ${kd(p.monthly)} a month`:""}.`;});
    return lines.join(" ");
  }
  if(/bill|due|pay|install|tabby|deema|فاتور|فواتير|قسط|أقساط|اقساط|مستحق|تابي|ديما/.test(s)){
    const r=sortedRem().slice(0,3);
    if(!r.length) return A? "ما عليك شي مستحق قريب." : "Nothing's due soon.";
    const when=x=>{const n=daysUntil(x.due); return A?(n<=0?"اليوم":n===1?"باچر":`بعد ${n} أيام`):(n<=0?"today":n===1?"tomorrow":`in ${n} days`);};
    const rest=r.slice(1).map(x=>A?`${tx(x.name)} بـ ${kd(x.amount)} ${when(x)}`:`${tx(x.name)} for ${kd(x.amount)} ${when(x)}`);
    return A
      ? `أقرب شي ${tx(r[0].name)}، ${kd(r[0].amount)} ${when(r[0])}.${rest.length?` بعدها ${joinList(rest)}.`:""}`
      : `Next up is ${tx(r[0].name)}, ${kd(r[0].amount)} ${when(r[0])}.${rest.length?` After that, ${joinList(rest)}.`:""}`;
  }
  const top=cats.slice(0,3).map(([c])=>A?(CAT[c]||CAT.other).ar:(CAT[c]||CAT.other).en.toLowerCase());
  const left=kd(Math.max(0,Math.round(S.budget-T.spent)));
  return A
    ? `هالشهر صرفت ${kd(Math.round(T.spent))} من ${kd(S.budget)}، وأغلبها راح على ${joinList(top)}. باقي لك ${left} لين آخر الشهر.`
    : `So far this month you've spent ${kd(Math.round(T.spent))} of your ${kd(S.budget)} budget, mostly on ${joinList(top)}. You've got ${left} left until the end of the month.`;
}
function joinList(a){
  if(a.length<2) return a.join("");
  const last=a[a.length-1];
  return S.lang==="ar" ? a.slice(0,-1).join("، ")+" و"+last : a.slice(0,-1).join(", ")+" and "+last;
}

let chatCtl=null;
function bindChat(){
  const f=document.getElementById("composer"), inp=document.getElementById("chatIn"), box=document.getElementById("msgs");
  box.scrollTop=box.scrollHeight;
  f.addEventListener("submit",e=>{e.preventDefault(); const q=inp.value.trim(); if(!q||ui.busy) return; inp.value=""; ask(q);});

}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function calm(){ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }
/* Reveals a reply word by word, like someone typing. Whole reply takes about 1-1.6 s. */
async function typeInto(el,text,box){
  if(calm()){ el.textContent=text; return; }
  el.textContent="";
  const parts=text.split(/(\s+)/);
  const words=parts.filter(p=>p.trim()).length||1;
  const step=Math.max(16,Math.min(55,1500/words));
  for(const p of parts){
    if(!p) continue;
    if(!p.trim()){ el.appendChild(document.createTextNode(p)); continue; }
    const w=document.createElement("span"); w.className="w"; w.textContent=p; el.appendChild(w);
    if(box && box.isConnected) box.scrollTop=box.scrollHeight;
    await sleep(step);
  }
}
async function ask(q){
  ui.busy=true;
  const started=performance.now();
  S.chat.push({role:"user",content:q}); S.chat=S.chat.slice(-30); persist();
  const box=document.getElementById("msgs");
  box.insertAdjacentHTML("beforeend", msgHtml({role:"user",content:q},true));
  box.scrollTop=box.scrollHeight;
  const sendBtn=app.querySelector(".send"); if(sendBtn) sendBtn.disabled=true;
  if(!calm()) await sleep(350); // a short beat before Thuraya starts typing
  box.insertAdjacentHTML("beforeend", `<div class="msg ai new" id="pending">${bot()}<div class="bub"><span class="typing" role="status" aria-label="${esc(t("thinking"))}"><i></i><i></i><i></i></span></div></div>`);
  box.scrollTop=box.scrollHeight;
  const bub=box.querySelector("#pending .bub");
  let answer=null, local=false, streamed=false;
  const s = ui.aiState==="off" ? null : await getSample();
  if(s){
    chatCtl=new AbortController();
    const hist=S.chat.slice(-12).filter(m=>!m.local||m.role==="user").map(m=>({role:m.role,content:m.content}));
    while(hist.length && hist[0].role!=="user") hist.shift();
    try{
      const r=await s([{role:"user",content:rules()},...hist],{cache:false,modelTier:"quick",signal:chatCtl.signal,onText:({text})=>{ if(bub){ bub.textContent=clean(text); box.scrollTop=box.scrollHeight; } }});
      answer=clean(r.text); streamed=true; ui.aiState="on";
    }catch(err){
      if(err && ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(err.code)) ui.aiState="off";
      answer=null;
    }
  } else ui.aiState="off";
  if(!answer && !s) answer=await askServer();
  if(!answer){ answer=localAnswer(q); local=true; }
  // Let the typing dots show for a natural moment (longer replies "take" a little longer).
  if(!streamed && !calm()){
    const wait=1000+Math.min(800,answer.length*3)-(performance.now()-started);
    if(wait>0) await sleep(wait);
  }
  S.chat.push({role:"assistant",content:answer,local}); S.chat=S.chat.slice(-30); persist();
  const pend=document.getElementById("pending");
  if(pend){
    pend.removeAttribute("id");
    const b=pend.querySelector(".bub");
    if(streamed) b.textContent=answer; else await typeInto(b,answer,box);
  }
  ui.busy=false; if(sendBtn) sendBtn.disabled=false; refreshChatStatus();
  const b2=document.getElementById("msgs"); if(b2) b2.scrollTop=b2.scrollHeight;
}
/* Live AI on your own website: api/chat.js on Vercel holds the API key and the instructions.
   The page sends only the language, a summary of this user's numbers and the recent chat.
   If the function isn't set up (no key) or fails, the chat falls back to the built-in answers. */
let serverAI = (location.protocol==="https:" || location.hostname==="localhost") ? null : false;
async function askServer(){
  if(serverAI===false) return null;
  const messages=S.chat.slice(-12).filter(m=>!m.local||m.role==="user").map(m=>({role:m.role,content:m.content}));
  while(messages.length && messages[0].role!=="user") messages.shift();
  try{
    const r=await fetch("api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang:S.lang,context:financeContext(),messages})});
    if(r.status===404 || r.status===405 || r.status===503){ serverAI=false; return null; }
    if(!r.ok) return null;
    const j=await r.json();
    if(j && typeof j.text==="string" && j.text.trim()){ serverAI=true; ui.aiState="on"; return clean(j.text); }
    return null;
  }catch(e){ return null; }
}
const clean = s => String(s||"").replace(/\*\*(.+?)\*\*/g,"$1").replace(/^#+\s*/gm,"").trim();

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const id=a.dataset.id, v=a.dataset.v;
  switch(a.dataset.act){
    case "closeSheet": closeSheet(); break;
    case "addTx": txSheet(); break;
    case "editTx": txSheet(id); break;
    case "delTx": S.txns=S.txns.filter(x=>x.id!==id); persist(); closeSheet(); render(true); toast(t("deleted_toast")); break;
    case "addGoal": goalSheet(); break;
    case "editGoal": goalSheet(id); break;
    case "delGoal": S.goals=S.goals.filter(x=>x.id!==id); persist(); closeSheet(); render(true); toast(t("deleted_toast")); break;
    case "addSav": savSheet(id); break;
    case "addRem": remSheet(); break;
    case "editRem": remSheet(id); break;
    case "delRem": S.reminders=S.reminders.filter(x=>x.id!==id); persist(); closeSheet(); render(true); toast(t("deleted_toast")); break;
    case "pay": payRem(id); break;
    case "addRec": recAddSheet(); break;
    case "viewRec": recView(id); break;
    case "delRec": S.receipts=S.receipts.filter(x=>x.id!==id); persist(); closeSheet(); render(true); toast(t("deleted_toast")); break;
    case "chip": if(!ui.busy) ask(t(a.dataset.q)); break;
    case "lang": S.lang=v; ui.invOut=""; persist(); render(true); break;
    case "copyEmail": {
      const done=()=>toast(t("copied"));
      const fallback=()=>{ const b=a.closest(".contact").querySelector("b"); const rg=document.createRange(); rg.selectNodeContents(b); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rg); };
      try{ navigator.clipboard.writeText(EMAIL).then(done,fallback); }catch(err){ fallback(); }
      break;
    }
    case "theme": S.theme=v; persist(); render(true); break;
    case "bank": if(!S.banks.includes(id)) S.banks.push(id); persist(); render(true); toast(t("linked")); break;
    case "billing": ui.billing=v; render(true); break;
    case "setPlan": S.plan=v; persist(); render(true); toast(t("saved_toast")); break;
    case "reset": confirmReset(); break;
    case "resetYes": { const keep={lang:S.lang,theme:S.theme}; S=seed(); Object.assign(S,keep); S.seenNotif=true; persist(); closeSheet(); go("home"); toast(t("reset_done")); break; }
    case "health": healthSheet(); break;
    case "bnpl": {
      S.bnpl=S.bnpl||[]; const p=BNPL.find(x=>x.id===id); if(!p) break;
      if(!S.bnpl.includes(id)){ S.bnpl.push(id); if(!S.reminders.some(r=>r.provider===id)) S.reminders.push(bnplRem(p,uid())); }
      persist(); render(true); toast(t("linked_toast",{p:S.lang==="ar"?p.ar:p.n})); break;
    }
    case "notifView": document.getElementById("notif").classList.add("hide"); go("reminders"); break;
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && ui.sheet) closeSheet(); });

/* ---------- Boot ---------- */
const VIEWS=["home","budget","goals","reminders","receipts","chat","profile","plans","invest"];
function fromHash(){ const h=(location.hash||"").slice(1); return VIEWS.includes(h)?h:"home"; }
window.addEventListener("hashchange",()=>{ const v=fromHash(); if(v!==view){ view=v; closeSheet(); document.getElementById("notif").classList.add("hide"); render(); } });
view=fromHash();
render();
const splash=document.getElementById("splash");
let splashSeen=false; try{ splashSeen=sessionStorage.getItem("thuraya-splash")==="1"; sessionStorage.setItem("thuraya-splash","1"); }catch(e){}
if(splashSeen){ splash.remove(); if(view==="home") showNotif(); }
else {
  splash.querySelector("p").textContent=t("tagline");
  setTimeout(()=>{ splash.classList.add("out"); setTimeout(()=>splash.remove(),600); if(view==="home") showNotif(); },1500);
}
})();

}
